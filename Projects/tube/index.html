
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUBE - Video Platform</title>
  <link rel="stylesheet" href="i.css">
  <script src="s.js" defer></script>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn">☰</button>
  <a href="#" id="logoBtn" class="logo"><span>▶</span> TUBE</a>

  <form id="searchForm" class="search-box">
    <input id="searchInput" type="search" placeholder="Search videos..." autocomplete="off">
    <button type="submit">🔍</button>
  </form>

  <button id="themeBtn" class="icon-btn">🌙</button>
</header>

<aside class="sidebar" id="sidebar">
  <button class="nav-item active" data-page="Home">🏠 Home</button>
  <button class="nav-item" data-page="Trending">🔥 Trending</button>
  <button class="nav-item" data-page="Music">🎵 Music</button>
  <button class="nav-item" data-page="Gaming">🎮 Gaming</button>
  <button class="nav-item" data-page="Education">📚 Education</button>
  <button class="nav-item" data-page="Technology">💻 Technology</button>
  <hr>
  <button class="nav-item" data-page="History">🕘 History</button>
  <button class="nav-item" data-page="Watch Later">⏰ Watch Later</button>
  <button class="nav-item" data-page="Liked Videos">👍 Liked Videos</button>
</aside>

<main class="main-content">
  <div class="category-bar">
    <button class="category active" data-category="All">All</button>
    <button class="category" data-category="Music">Music</button>
    <button class="category" data-category="Gaming">Gaming</button>
    <button class="category" data-category="Education">Education</button>
    <button class="category" data-category="Technology">Technology</button>
    <button class="category" data-category="Sports">Sports</button>
  </div>

  <div class="heading">
    <div>
      <h1 id="pageTitle">Home</h1>
      <p id="pageSubtitle">Discover videos you might enjoy</p>
    </div>
    <span id="videoCount"></span>
  </div>

  <section id="videoGrid" class="video-grid"></section>

  <section id="emptyState" class="empty-state" hidden>
    <h2>No videos found</h2>
    <p>Try another search or category.</p>
    <button id="showHomeBtn">Back to Home</button>
  </section>
</main>

<!-- VIDEO PLAYER -->
<div id="videoModal" class="video-modal">
  <div class="player-box">
    <div class="player-heading">
      <h2 id="modalTitle">Video</h2>
      <button id="closeModal" class="close-btn">✕</button>
    </div>

    <video id="videoPlayer" controls playsinline preload="metadata">
      Your browser does not support HTML video.
    </video>

    <div class="video-details">
      <div>
        <h3 id="modalChannel"></h3>
        <p id="modalViews"></p>
      </div>
      <div class="actions">
        <button id="likeBtn">👍 Like</button>
        <button id="saveBtn">⏰ Watch Later</button>
        <button id="shareBtn">↗ Share</button>
      </div>
    </div>

    <p id="modalDescription" class="description"></p>

    <hr>
    <h3>Comments</h3>
    <form id="commentForm" class="comment-form">
      <input id="commentInput" placeholder="Write a comment..." maxlength="300">
      <button type="submit">Post</button>
    </form>
    <div id="commentsList"></div>
  </div>
</div>

<footer>© 2026 TUBE | Video Platform</footer>

</body>
</html>
